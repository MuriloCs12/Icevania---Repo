{%extends 'pagina-base-entrar.html'%}

{% block titulo %} 
    Listagem de Admins
{% endblock %}

{%block conteudo%}
    <div class="main_lista d-flex container flex-column justify-content-center">
        <div id="lista" class="d-flex flex-column rounded-3 gap-2 p-2">
            <h2 class="text-light text-center mb-4 mt-4">Lista de admins cadastrados</h2>
            {%for admin in admins%}
                <div class="admin d-flex flex-column text-light p-4 rounded-2">
                    <h1>{{admin.username}}</h1>
                    <h2>{{admin.email}}</h2>
                </div>
            {%endfor%}
        </div>
    </div>
{%endblock%}
